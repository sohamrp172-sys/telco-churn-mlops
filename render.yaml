services:
  - type: web
    name: telco-churn-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      echo "Verifying model file..."
      ls -la models/churn_model.pkl || echo "WARNING: Model file not found!"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
