services:
  - type: web
    name: telco-churn-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python src/preprocess.py --input data/raw/telco_v1.csv --output data/processed/telco_processed.csv
      python src/train.py --input data/processed/telco_processed.csv --model-type gb --run-name render-deploy
      ls -lh /tmp/churn_model.pkl
      echo "✓ Model trained and saved to /tmp"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
